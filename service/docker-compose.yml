# FIRST TIME? Read service/docs/first-run.md - four steps, and this file is
# step 2.
#
# As written, `docker compose up -d licence` needs no directory created, no
# chown and no root: the state lives in a NAMED VOLUME that Docker initialises
# with the ownership the image already set. The only things that must be your
# own are LICENCE_PUBLIC_KEYS and the PayPal values under `environment`.
#
# The vendor runs this. It is a snippet to paste into whatever compose file the
# host already has, rather than a file to run as-is.
#
# THE SIGNING KEY IS MOUNTED HERE, which is what makes activation instant and
# is the one deliberate security trade in this file. The volumes block says
# exactly what it costs and what the alternative is.

services:
  licence:
    # THE NORMAL PATH: pull the image CI built. No source tree on this host,
    # nothing to copy up, nothing to rebuild - `docker compose pull licence &&
    # docker compose up -d licence` is the whole deployment.
    #
    # The project is private, so the pull needs credentials. Create a deploy
    # token scoped to read_registry and `docker login registry.koper.local:5050`
    # once; service/README.md, "The image CI builds", has the exact steps and
    # says why it must not be a personal access token.
    #
    # THERE IS NO `latest` UNTIL THE FIRST RELEASE IS TAGGED, and a pull before
    # then fails with exactly this, which reads like a broken registry and is
    # not one:
    #
    #   manifest for .../licence-service:latest not found: manifest unknown
    #
    # `latest` is written only by a full `vX.Y.Z` tag. Pushes to main publish
    # `main-<short sha>` and `main`; a PRERELEASE tag (v0.1.0-rc.1) publishes
    # only itself and deliberately never moves `latest`, so that the tag people
    # pull blind is never a release candidate. See ci/image-tags.sh, which is
    # the only thing that decides this.
    #
    # SO, BEFORE THE FIRST RELEASE, name the commit you want:
    #
    #   LICENCE_IMAGE=registry.koper.local:5050/graxo/emby-sso/licence-service:main
    #
    # AND AFTER IT, PIN IT. A specific `1.4.0` never moves and is what a
    # production host should name, so that a deploy is a decision rather than
    # whatever happened to be latest at restart time. `main` moves with every
    # push to the default branch and is not for this file.
    #
    #   LICENCE_IMAGE=registry.koper.local:5050/graxo/emby-sso/licence-service:1.4.0
    #
    # The host part is registry.koper.local:5050 - the address the runners push
    # to, which is what CI_REGISTRY_IMAGE resolves to on this instance. The
    # service-image job prints the exact base it pushed to; take it from there
    # rather than trusting this line.
    image: ${LICENCE_IMAGE:-registry.koper.local:5050/graxo/emby-sso/licence-service:latest}

    # THE ALTERNATIVE: build here from a source tree on this host. Only needed
    # if the registry is unreachable or you are testing an uncommitted change -
    # then `docker compose up -d --build licence`. Uncomment `build:` and
    # comment out `image:` above; leaving both means compose builds and *tags*
    # the result with that name, which is not what a pull-based host wants.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped

    # Nothing else runs on this box, and this container needs almost nothing.
    read_only: true
    tmpfs:
      # /tmp has to hold one VACUUM INTO snapshot of the database while an
      # encrypted backup is being built - the whole store, uncompressed, for a
      # few seconds. 128m is far more than a one-person vendor's sales will ever
      # be; if a backup ever fails for space, this is the number, and mem_limit
      # below is the next one, because the archive is also held in memory.
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # WHAT AN ATTACKER CAN COST YOU, bounded. None of these change what the
    # service does; they cap the damage of a bug or a flood in the one process
    # that answers the internet. Without them a request pattern that makes this
    # container allocate takes the host down with it, and the host is where
    # everything else lives.
    #
    # The numbers are generous for what this actually does - a handful of SQLite
    # transactions and one RSA verification per upload - and are meant to be
    # raised deliberately rather than tuned. If the service is being OOM-killed,
    # find out why before raising them: this workload has no reason to grow.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 1024
        hard: 2048

    # Explicit, rather than relying on the Dockerfile's USER staying put. The
    # data volume has to be owned by this uid; see service/docs/first-run.md.
    user: "5678:5678"

    volumes:
      # THE SIGNING KEY. Mount it, and this service signs licences itself the
      # moment a customer activates - one press of Activate and they have a
      # licence. That is what self-service costs, and it is worth being precise
      # about the cost:
      #
      #   the private key is loaded by the process that answers the internet. It
      #   mints a valid licence for ANY Emby server, forever, and there is no
      #   revocation - the plugin verifies offline and never calls home. So a
      #   remote-code-execution bug here, a dependency compromise, or a stolen
      #   admin session hands over the whole scheme, silently and permanently.
      #
      # THE ALTERNATIVE IS STILL THERE AND STILL SUPPORTED: leave this mount and
      # LICENCE_SIGNING_KEY_PATH out entirely, and licences are signed with
      # `licencetool sign` on a machine that answers no requests, from a file
      # /admin/signing hands you. Safer. Not instant.
      #
      # Mounted READ-ONLY and as a FILE rather than a directory, so nothing else
      # beside it - a ledger, a backup, an editor's swap file - is inside the
      # container at all. On the host it must be `chmod 600` and owned by uid
      # 5678; the service refuses to start if any bit beyond the owner's is set:
      #
      #   sudo install -o 5678 -g 5678 -m 600 \
      #     licence-signing-key.private.json /srv/emby-sso/secrets/
      - /srv/emby-sso/secrets/licence-signing-key.private.json:/run/secrets/licence-signing-key.private.json:ro

      # The state: SQLite store, the ledger in the offline tool's format, and
      # the outbox of codes waiting to be sent.
      #
      # A NAMED VOLUME, NOT A BIND MOUNT, and that is the difference between
      # `docker compose up -d` working and it not.
      #
      # This container runs as uid 5678 and cannot chown anything - it holds no
      # capabilities and never runs as root. SQLite has to CREATE files in here
      # (the database and its -wal and -shm siblings), so the directory itself
      # must be writable by that uid.
      #
      #   a BIND MOUNT arrives owned by whoever owns it on the host, which is
      #   root unless somebody remembered `chown -R 5678:5678`. Nothing in the
      #   container can fix that, so the first start fails with SQLite error 14,
      #   'unable to open database file' - which names neither the uid nor the
      #   directory. It was the most common first failure of this service.
      #
      #   a NAMED VOLUME is initialised by Docker from the image, ownership
      #   included, and the Dockerfile already does `chown 5678:5678 /data`. So
      #   it comes up owned correctly, with no chown, no root and nothing for
      #   the operator to remember.
      #
      # BACK IT UP. Losing it loses who bought what, and nothing anywhere else
      # can rebuild it - not PayPal, not the plugin, not the signing machine.
      # Set LICENCE_BACKUP_PASSPHRASE below and take an encrypted copy from
      # /admin/backup; read it back with `restore`. That is the supported route
      # and it does not care which kind of volume this is.
      #
      # IF YOU WANT THE DATA AT A PATH YOU CHOOSE, a bind mount still works -
      # swap the line below for `- /srv/emby-sso/data:/data` and run
      # `sudo chown -R 5678:5678 /srv/emby-sso/data` FIRST, before the first
      # start. The service prints the uid it is actually running as when it
      # cannot write, so a mismatch is one line to diagnose rather than a guess.
      - licence-data:/data

    environment:
      # --- required ---------------------------------------------------------
      LICENCE_DATA_DIR: /data

      # Turns on self-service signing. Remove this line AND the key mount above
      # to go back to signing offline; the service does not need it to run.
      LICENCE_SIGNING_KEY_PATH: /run/secrets/licence-signing-key.private.json

      # The PUBLIC half of the RELEASE key, which signs plugin updates. NOT the
      # licence key: that one is on this host, and if it could sign releases too
      # then breaking in here would mean shipping a backdoored DLL to every
      # customer. The release key stays on the vendor's own machine.
      #
      # Only used to check a manifest before publishing it at /admin/release.
      # Not a secret.
      LICENCE_RELEASE_PUBLIC_KEYS: '{"kty":"RSA","n":"...","e":"AQAB"}'

      # The PUBLIC key or keys the plugin build trusts - one JWK, or a JSON
      # array of them. NOT a secret: it is the same value that is compiled into
      # src/Emby.Sso/Protocol/LicencePublicKey.cs, and `licencetool keygen`
      # printed it. It is what lets this service check a signed licence before
      # storing it, so that a wrong key or a wrong file is caught on your screen
      # rather than on a customer's server.
      #
      # It must match the plugin build your customers are running. When you
      # rotate a key, both sides get the new one and BOTH keep the old one until
      # every licence signed with it has expired.
      #
      # The service refuses to start if this carries private key material.
      LICENCE_PUBLIC_KEYS: '{"kty":"RSA","n":"...","e":"AQAB"}'

      # The address the plugin has compiled in and the address PayPal sends
      # buyers back to. Must match what the plugin ships with.
      #
      # It is also the address plugin updates are served from - this plus
      # /v1/release/download - and therefore the address a release manifest has
      # to be signed for. Changing it after a release means signing again.
      LICENCE_PUBLIC_BASE_URL: https://licence.example.com

      # From the PayPal developer dashboard, on the webhook you created. It is
      # part of the message PayPal signs, so this being wrong fails every
      # webhook closed.
      PAYPAL_ENV: sandbox
      PAYPAL_WEBHOOK_ID: WH-0000000000000000-000000000000000

      # --- required to sell anything ---------------------------------------
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_CURRENCY: GBP
      PAYPAL_PRICE: "19.00"

      # --- emailing the code: ALL OPTIONAL, and off by default ---------------
      # With SMTP_HOST unset, a paid code goes to /data/codes-outbox.jsonl and
      # you send it by hand - which is what this service did before mail
      # existed, and is a perfectly good arrangement. Setting SMTP_HOST is the
      # whole of turning delivery on.
      #
      # A failed send NEVER fails the webhook: the code is written to the outbox
      # first, the mail is sent afterwards on a background thread, and PayPal
      # gets its 200 either way. See service/README.md, "Emailing the code", and
      # docs/email-delivery-checklist.md before you trust a real send - no
      # message has ever left the machine this was written on.
      #
      # SMTP_HOST: smtp.example.com
      # SMTP_FROM_ADDRESS: licences@example.com
      # SMTP_USERNAME: licences@example.com
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
      #
      # SMTP_SECURITY is one of three words and nothing else:
      #   tls       implicit TLS, the session is encrypted from the first byte,
      #             usually port 465
      #   starttls  a plain connection that MUST upgrade - the send fails rather
      #             than continuing in the clear - usually 587. THE DEFAULT.
      #   none      no encryption. Only for a relay on this host or a network
      #             you own; every code sent through it is readable in transit,
      #             and the service refuses to start if you also set a username,
      #             because that would put the relay password on the wire too.
      # SMTP_PORT defaults to 465/587/25 to match, so set it only if your relay
      # is somewhere unusual.
      #
      # SMTP_SECURITY: starttls
      # SMTP_PORT: "587"
      # SMTP_FROM_NAME: "Emby SSO licences"
      # SMTP_REPLY_TO: help@example.com
      # SMTP_SUBJECT: "Your Emby SSO plugin licence code"
      # SMTP_SUPPORT_CONTACT: help@example.com
      # SMTP_TIMEOUT_SECONDS: "30"
      # SMTP_MAX_ATTEMPTS: "4"       # then the outbox is the fallback
      # SMTP_RETRY_SECONDS: "30"     # first backoff, quadrupled each attempt
      #
      # To change the wording without rebuilding the image, mount a plain-text
      # template read-only and point at it. It must contain {code}.
      # SMTP_TEMPLATE_PATH: /run/config/licence-email.txt

      # --- optional, with the defaults shown --------------------------------
      # LICENCE_ACTIVATIONS_ALLOWED: "3"
      # LICENCE_DAYS: "365"
      # PAYPAL_MINIMUM_AMOUNT: "19.00"      # defaults to PAYPAL_PRICE
      # PAYPAL_PRODUCT_NAME: "Emby SSO plugin licence"
      # LICENCE_TRUSTED_PROXY_HOPS: "0"     # 1 if a reverse proxy is in front
      # LICENCE_RATE_PER_CLIENT_PER_MINUTE: "10"
      # LICENCE_RATE_PER_CLIENT_BURST: "5"
      # LICENCE_RATE_GLOBAL_PER_MINUTE: "300"

      # --- encrypted backups: optional, and worth turning on ----------------
      # With this set, /admin/backup hands you an encrypted copy of everything
      # on the volume that cannot be rebuilt: who bought what, which servers are
      # activated, every licence signed so far, the outbox and the audit trail.
      # There is no unencrypted option - a backup of this store holds redemption
      # codes and live licences, and the whole point of taking one is to put it
      # somewhere less careful than this box.
      #
      # Generate one and keep it somewhere OTHER than beside the backups. It has
      # to be the same passphrase to read a backup back, so changing it strands
      # every backup taken before the change.
      #
      #   openssl rand -base64 32
      #
      # LICENCE_BACKUP_PASSPHRASE: ${LICENCE_BACKUP_PASSPHRASE}

      # --- the admin page: optional, and off unless a password is set --------
      # ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      #
      # IN FRONT OF THE PASSWORD. Both optional, both off by default, both fail
      # closed when set, and a request that fails either gets a 404 - the page
      # does not exist rather than refusing, so a scanner learns nothing.
      #
      # The admin page is on the public internet and the password is otherwise
      # the only barrier to the box holding your customer list. It is a good
      # password and the login is throttled, but it is one factor: one reused
      # password, one keylogger, one screenshot. A network restriction is a
      # second, independent thing an attacker must have, costs nothing on a
      # machine you already own, and cannot be phished.
      #
      # ADMIN_ALLOWED_CIDRS needs LICENCE_TRUSTED_PROXY_HOPS to be right, or
      # every request looks like it came from the proxy. Set the hop count first
      # and check the logs before relying on this.
      #
      # ADMIN_ALLOWED_CIDRS: "203.0.113.4/32, 10.0.0.0/8"
      #
      # ADMIN_REQUIRED_HEADER is where a Cloudflare Access assertion, an
      # oauth2-proxy header, a client certificate your proxy verified, or simply
      # a long shared secret plugs in. YOUR PROXY MUST STRIP IT FROM INCOMING
      # REQUESTS - a header a client can set is not a check, and nothing here
      # can enforce that for you.
      #
      # ADMIN_REQUIRED_HEADER: "X-From-The-Proxy"
      # ADMIN_REQUIRED_HEADER_VALUE: ${ADMIN_PROXY_SECRET}

    # Bound to localhost, because TLS is the reverse proxy's job and this
    # service must never be the thing on port 443. If there is no proxy, there
    # is no HTTPS, and the contract says HTTPS only.
    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      # /healthz proves the volume is writable, which is the failure that would
      # otherwise show up as a lost sale. It also reports which PUBLIC keys this
      # service trusts, so "does it agree with the plugin build?" is answerable
      # without a shell on the box.
      test: ["CMD", "dotnet", "Emby.Sso.LicenceService.dll", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# The state volume. Named rather than bound so that Docker gives it the
# ownership the image already set on /data - see the comment on the mount
# itself. `docker volume inspect emby-sso_licence-data` says where it lives on
# the host if you ever need to reach it directly.
volumes:
  licence-data:
