# Every push runs the test suite, then a Release build whose output is checked
# to be the ILRepack-merged plugin. Pushing a tag like v1.4.0 additionally
# uploads that build to the package registry and creates a GitLab Release
# pointing at it.
#
# The version an operator sees in Emby's dashboard comes from the tag and
# nowhere else: ci/version.sh turns v1.4.0 into 1.4.0, the build is handed it
# with -p:Version, and ci/verify-artifact.sh refuses to continue unless that
# version is genuinely inside the DLL about to be shipped.

stages:
  - test
  - build
  - publish
  - release
  # Independent of everything above it. See the pages job at the bottom.
  - docs

variables:
  # Pinned: rebuilding an old tag should use the SDK that tag was tested with.
  SDK_IMAGE: "mcr.microsoft.com/dotnet/sdk:8.0.424-bookworm-slim"
  # NuGet's cache has to sit inside the project directory for GitLab to cache it.
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_NAME: "emby-sso"
  MERGED_DLL: "src/Emby.Sso/bin/Release/netstandard2.0/merged/Emby.Sso.dll"

default:
  image: $SDK_IMAGE

.nuget-cache:
  cache:
    key:
      files:
        - src/Emby.Sso/Emby.Sso.csproj
        - tests/Emby.Sso.Tests/Emby.Sso.Tests.csproj
    paths:
      - .nuget/packages

# Publishing is a deliberate act, so only a version tag does it.
.release-tags-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

test:
  extends: .nuget-cache
  stage: test
  script:
    - dotnet test tests/Emby.Sso.Tests --logger "console;verbosity=normal"

build:
  extends: .nuget-cache
  stage: build
  # Explicit, not incidental: no artifact exists unless the suite passed.
  needs:
    - job: test
  script:
    - VERSION="$(ci/version.sh)"
    - INFORMATIONAL_VERSION="$VERSION+$CI_COMMIT_SHA"
    - echo "Building $VERSION from $CI_COMMIT_SHA"
    - dotnet build -c Release -p:Version="$VERSION" -p:SourceRevisionId="$CI_COMMIT_SHA"
    # The merged DLL physically contains a dozen MIT- and Apache-licensed
    # libraries, and merging is redistribution: their notices have to ship with
    # it. This fails the build if a dependency was added to ILRepack.targets
    # without THIRD-PARTY-NOTICES being updated.
    - ci/verify-notices.sh src/Emby.Sso/ILRepack.targets THIRD-PARTY-NOTICES
    - ci/verify-artifact.sh "$MERGED_DLL" "$INFORMATIONAL_VERSION"
    - rm -rf dist && mkdir dist
    - cp "$MERGED_DLL" dist/Emby.Sso.dll
    # LICENSE and THIRD-PARTY-NOTICES travel with the DLL, in the artifact and
    # in the package registry. Not optional: the third-party licences require
    # it, and an operator who downloads one file should get all three.
    - cp LICENSE THIRD-PARTY-NOTICES dist/
    - (cd dist && sha256sum Emby.Sso.dll > Emby.Sso.dll.sha256)
    - cat dist/Emby.Sso.dll.sha256
    - echo "VERSION=$VERSION" > build.env
  artifacts:
    name: "emby-sso-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    reports:
      # Carries VERSION to the publish and release jobs.
      dotenv: build.env
    expire_in: 30 days

publish:
  extends: .release-tags-only
  stage: publish
  needs:
    - job: build
      artifacts: true
  script:
    # VERSION arrives from build's dotenv report. If that ever stops working,
    # every URL below silently gains an empty path segment and the upload goes
    # somewhere nobody will find. Fail here instead, naming the cause.
    - |
      if [ -z "${VERSION:-}" ]; then
        echo "publish: VERSION is empty - the dotenv report from the build job did not arrive." >&2
        exit 1
      fi
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION"
    # Quoted as one block: an unquoted "echo foo: bar" entry is a YAML mapping,
    # not a string, and the pipeline is rejected before anything runs.
    - |
      echo "publish: version=$VERSION tag=$CI_COMMIT_TAG"
      echo "publish: package base $PACKAGE_URL"
    - |
      for file in Emby.Sso.dll Emby.Sso.dll.sha256 LICENSE THIRD-PARTY-NOTICES; do
        echo "Uploading $file to $PACKAGE_URL/$file"
        curl --fail-with-body --silent --show-error --retry 3 \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "dist/$file" \
          "$PACKAGE_URL/$file"
        echo
      done
    - ci/release-notes.sh "$VERSION" "$CI_COMMIT_SHA" dist/Emby.Sso.dll.sha256 "$PACKAGE_URL" "$CI_COMMIT_TAG_MESSAGE" > release-notes.md
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 30 days

release:
  extends: .release-tags-only
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    # build for VERSION, publish for the notes the release is described with.
    - job: build
      artifacts: true
    - job: publish
      artifacts: true
  script:
    - echo "Creating the GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Emby SSO $CI_COMMIT_TAG"
    description: "./release-notes.md"
    assets:
      links:
        - name: "Emby.Sso.dll"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/Emby.Sso.dll"
          link_type: package
        - name: "Emby.Sso.dll.sha256"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/Emby.Sso.dll.sha256"
          link_type: other
        - name: "LICENSE"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/LICENSE"
          link_type: other
        - name: "THIRD-PARTY-NOTICES"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/THIRD-PARTY-NOTICES"
          link_type: other

# The documentation site (docs/site/, MkDocs with the Material theme),
# published by GitLab Pages from public/ as GitLab's contract requires.
#
# Deliberately independent of the release chain in both directions. `needs: []`
# means it never waits for the test suite, and `allow_failure: true` means a
# broken docs build cannot turn a tag's pipeline red or stop a release from
# being cut. The converse also holds: publish and release hang off build
# through `needs:`, so they run regardless of what this job does.
#
# `allow_failure: true` costs something — a docs build that breaks shows as a
# warning rather than a failure, and it is possible to stop noticing. The
# trade was made deliberately: documentation must never be able to hold up a
# security fix. If that stops being the right call, flip it to false; nothing
# else here depends on it.
pages:
  stage: docs
  # Pinned by digest, not just by tag. An operator reads this site while their
  # server is broken; a toolchain that silently changes what it renders is not
  # acceptable. The Python version and the whole dependency tree in
  # docs/requirements.txt are pinned for the same reason - including mkdocs
  # itself, which matters because MkDocs 2.0 is announced as a
  # backwards-incompatible break that would take the Material theme with it.
  image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
  # Starts immediately. Nothing it produces depends on a build artifact, and
  # nothing that produces an artifact depends on it.
  needs: []
  allow_failure: true
  rules:
    # GitLab Pages only ever publishes from the default branch, so building the
    # site on a feature branch produces something nobody can look at. `changes`
    # keeps it off pipelines that touched no documentation; on those, the site
    # already published simply stays up.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - mkdocs.yml
        - docs/requirements.txt
        - docs/site/**/*
        - .gitlab-ci.yml
    # And on demand from the Pipelines page, to republish without a commit.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    PIP_ROOT_USER_ACTION: "ignore"
  script:
    - python -m pip install --no-input -r docs/requirements.txt
    # docs/superpowers/ is this project's internal development record - specs,
    # plans, spikes, verification notes - and none of it is documentation for
    # an operator. The site's sources live in docs/site/ precisely so that
    # MkDocs cannot reach it: MkDocs only ever reads what is inside docs_dir.
    # This is the tripwire for someone "tidying" that line later.
    - |
      if ! grep -qx 'docs_dir: docs/site' mkdocs.yml; then
        echo "pages: docs_dir is no longer docs/site. Refusing to build: pointing it at docs/ would publish docs/superpowers/, which is internal." >&2
        exit 1
      fi
    # Warnings are errors: a dead cross-reference in a site the plugin's own
    # settings page links into is a real failure, not a nit.
    - mkdocs build --strict
    # Belt and braces, on the built output this time. If anything from the
    # internal record ever reaches public/, do not publish it.
    - |
      if find public -path '*superpowers*' -print -quit | grep -q .; then
        echo "pages: internal development records reached public/. Refusing to publish." >&2
        find public -path '*superpowers*' >&2
        exit 1
      fi
    # Block scalar, not a bare list entry: `- echo "pages: built ..."` parses as
    # a YAML mapping because of the colon-space, and GitLab rejects the whole
    # file - every job, not just this one. Second time in this file; see publish.
    - |
      echo "pages: built $(find public -name '*.html' | wc -l) pages into public/"
  artifacts:
    paths:
      - public
    expire_in: 30 days
