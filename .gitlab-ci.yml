# Every push runs the test suite, then a Release build whose output is checked
# to be the ILRepack-merged plugin. Pushing a tag like v1.4.0 additionally
# uploads that build to the package registry and creates a GitLab Release
# pointing at it.
#
# The version an operator sees in Emby's dashboard comes from the tag and
# nowhere else: ci/version.sh turns v1.4.0 into 1.4.0, the build is handed it
# with -p:Version, and ci/verify-artifact.sh refuses to continue unless that
# version is genuinely inside the DLL about to be shipped.

stages:
  - test
  - build
  - publish
  - release
  # Independent of everything above it. See the pages and wiki jobs at the bottom.
  - docs

variables:
  # Pinned: rebuilding an old tag should use the SDK that tag was tested with.
  SDK_IMAGE: "mcr.microsoft.com/dotnet/sdk:8.0.424-bookworm-slim"
  # NuGet's cache has to sit inside the project directory for GitLab to cache it.
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_NAME: "emby-sso"
  MERGED_DLL: "src/Emby.Sso/bin/Release/netstandard2.0/merged/Emby.Sso.dll"
  # The licence service's container image, pushed to this project's own
  # registry as a sub-repository so the plugin's packages and the service's
  # image never share a name. The host part is never written down here: it
  # comes from CI_REGISTRY_IMAGE, so moving the GitLab instance moves this too.
  SERVICE_IMAGE_NAME: "licence-service"

default:
  image: $SDK_IMAGE

.nuget-cache:
  cache:
    key:
      files:
        - src/Emby.Sso/Emby.Sso.csproj
        - tests/Emby.Sso.Tests/Emby.Sso.Tests.csproj
    paths:
      - .nuget/packages

# The service is a separate solution with a separate dependency set (MailKit,
# BouncyCastle, ASP.NET), so it gets its own cache key. Same directory, because
# NUGET_PACKAGES is global; different key, because a plugin-only change should
# not invalidate the service's restore or the other way round.
.service-nuget-cache:
  cache:
    key:
      # GitLab allows at most two files here, so Emby.Sso.Licensing.csproj is
      # left out: it is a project reference with a tiny package set, and a key
      # that misses a change only costs one restore of the missing packages.
      # The cache is a speed optimisation and never a correctness one.
      files:
        - service/src/Emby.Sso.LicenceService/Emby.Sso.LicenceService.csproj
        - service/tests/Emby.Sso.LicenceService.Tests/Emby.Sso.LicenceService.Tests.csproj
    paths:
      - .nuget/packages

# Publishing is a deliberate act, so only a version tag does it.
.release-tags-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

test:
  extends: .nuget-cache
  stage: test
  script:
    - dotnet test tests/Emby.Sso.Tests --logger "console;verbosity=normal"

# Fails the pipeline if any package this project pulls in - directly or
# transitively - has a known advisory against it.
#
# WHY IT IS A GATE AND NOT A REPORT. The plugin ships as ONE merged DLL: ILRepack
# folds Microsoft.IdentityModel, Newtonsoft.Json, BouncyCastle and the rest into
# Emby.Sso.dll and internalises them. An operator who installs it cannot see what
# is inside, cannot patch a dependency without a new build from here, and has no
# scanner that would tell them. The same is true of the service image. So a
# vulnerable dependency is not something a downstream user can act on, and the
# only place it can be caught is here, before it is published.
#
# --include-transitive, because that is where these things live: nothing in this
# repository references BouncyCastle on purpose.
#
# IT NEEDS THE NETWORK. `dotnet list package --vulnerable` asks nuget.org for the
# current advisory database rather than reading a cached copy, so this job fails
# when nuget.org is unreachable. That is the right way round for a security gate,
# but it does mean a network outage shows up as a red pipeline here.
dependencies-audit:
  extends: .nuget-cache
  stage: test
  needs: []
  script:
    - ci/audit-packages.sh Emby.Sso.sln service/Emby.Sso.Service.sln

build:
  extends: .nuget-cache
  stage: build
  # Explicit, not incidental: no artifact exists unless the suite passed and no
  # dependency in the merged DLL has an advisory against it.
  needs:
    - job: test
    - job: dependencies-audit
  script:
    - VERSION="$(ci/version.sh)"
    - INFORMATIONAL_VERSION="$VERSION+$CI_COMMIT_SHA"
    - echo "Building $VERSION from $CI_COMMIT_SHA"
    - dotnet build -c Release -p:Version="$VERSION" -p:SourceRevisionId="$CI_COMMIT_SHA"
    # The merged DLL physically contains a dozen MIT- and Apache-licensed
    # libraries, and merging is redistribution: their notices have to ship with
    # it. This fails the build if a dependency was added to ILRepack.targets
    # without THIRD-PARTY-NOTICES being updated.
    - ci/verify-notices.sh src/Emby.Sso/ILRepack.targets THIRD-PARTY-NOTICES
    - ci/verify-artifact.sh "$MERGED_DLL" "$INFORMATIONAL_VERSION"
    - rm -rf dist && mkdir dist
    - cp "$MERGED_DLL" dist/Emby.Sso.dll
    # LICENSE and THIRD-PARTY-NOTICES travel with the DLL, in the artifact and
    # in the package registry. Not optional: the third-party licences require
    # it, and an operator who downloads one file should get all three.
    - cp LICENSE THIRD-PARTY-NOTICES dist/
    - (cd dist && sha256sum Emby.Sso.dll > Emby.Sso.dll.sha256)
    - cat dist/Emby.Sso.dll.sha256
    - echo "VERSION=$VERSION" > build.env
  artifacts:
    name: "emby-sso-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    reports:
      # Carries VERSION to the publish and release jobs.
      dotenv: build.env
    expire_in: 30 days

publish:
  extends: .release-tags-only
  stage: publish
  needs:
    - job: build
      artifacts: true
  script:
    # VERSION arrives from build's dotenv report. If that ever stops working,
    # every URL below silently gains an empty path segment and the upload goes
    # somewhere nobody will find. Fail here instead, naming the cause.
    - |
      if [ -z "${VERSION:-}" ]; then
        echo "publish: VERSION is empty - the dotenv report from the build job did not arrive." >&2
        exit 1
      fi
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION"
    # Quoted as one block: an unquoted "echo foo: bar" entry is a YAML mapping,
    # not a string, and the pipeline is rejected before anything runs.
    - |
      echo "publish: version=$VERSION tag=$CI_COMMIT_TAG"
      echo "publish: package base $PACKAGE_URL"
    - |
      for file in Emby.Sso.dll Emby.Sso.dll.sha256 LICENSE THIRD-PARTY-NOTICES; do
        echo "Uploading $file to $PACKAGE_URL/$file"
        curl --fail-with-body --silent --show-error --retry 3 \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "dist/$file" \
          "$PACKAGE_URL/$file"
        echo
      done
    - ci/release-notes.sh "$VERSION" "$CI_COMMIT_SHA" dist/Emby.Sso.dll.sha256 "$PACKAGE_URL" "$CI_COMMIT_TAG_MESSAGE" > release-notes.md
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 30 days

release:
  extends: .release-tags-only
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    # build for VERSION, publish for the notes the release is described with.
    - job: build
      artifacts: true
    - job: publish
      artifacts: true
  script:
    - echo "Creating the GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Emby SSO $CI_COMMIT_TAG"
    description: "./release-notes.md"
    assets:
      links:
        - name: "Emby.Sso.dll"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/Emby.Sso.dll"
          link_type: package
        - name: "Emby.Sso.dll.sha256"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/Emby.Sso.dll.sha256"
          link_type: other
        - name: "LICENSE"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/LICENSE"
          link_type: other
        - name: "THIRD-PARTY-NOTICES"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$VERSION/THIRD-PARTY-NOTICES"
          link_type: other

# ---------------------------------------------------------------------------
# The licence service. A separate solution (service/Emby.Sso.Service.sln) that
# is deliberately NOT in Emby.Sso.sln, so the plugin build cannot ship any of
# it - which also meant, until these two jobs existed, that nothing in CI ever
# compiled it and a broken service was publishable. It is not any more:
# service-image runs only behind service-test.
#
# These two jobs are independent of the plugin's test/build/publish/release
# chain in both directions. The image contains no plugin code and the plugin
# artifact contains no service code, so neither should be able to hold up or
# break the other.
# ---------------------------------------------------------------------------

service-test:
  extends: .service-nuget-cache
  stage: test
  # Starts immediately; it shares nothing with the plugin's test job.
  needs: []
  script:
    - dotnet test service/Emby.Sso.Service.sln --logger "console;verbosity=normal"

# Builds service/Dockerfile and pushes it to this project's container registry,
# so the deployment host can `docker compose pull` instead of being handed a
# copy of the source and running `docker compose up --build`.
#
# THIS IS THE CLIENT-PORTAL PIPELINE'S DOCKER JOB, adapted. That one has been
# pushing to this same registry from these same runners for a while; this one
# spent three runs failing on TLS while trying to be cleverer. Where the two
# differ below, the difference is explained; where they agree, they agree on
# purpose, so that fixing one teaches you how to fix the other.
#
# WHY DIND AND NOT KANIKO. Kaniko needs no privileged runner, which is why it
# was chosen - on the assumption that these runners were not privileged. They
# are: the runner's own config.toml already defines a dind service. So the
# thing kaniko was bought for was not for sale, and what was left was an
# archived-upstream builder that could not be given the registry's CA.
#
# TWO DIND SUBTLETIES, both learned from the client-portal job and neither
# obvious from a failure:
#
#   1. THE ALIAS MUST NOT BE `docker`. The runner's config.toml already defines
#      a dind service under that alias, and GitLab refuses to hand the same
#      alias to a job-defined service ("alias is already in use by another
#      service"). DOCKER_HOST would then quietly address the RUNNER's daemon,
#      which trusts neither the internal CA nor the registry, and every push
#      fails with x509 - a message that says nothing about aliases.
#
#   2. DOCKER_TLS_CERTDIR IS EMPTIED ON PURPOSE. That turns off TLS between
#      this job's client and its own daemon, on the private job network. It is
#      not the registry connection and has nothing to do with the CA below;
#      leaving it on would mean sharing a client-certificate volume with the
#      runner's dind service, which is the thing being avoided.
#
# THE REGISTRY'S CERTIFICATE. registry.koper.local:5050 presents one
# certificate, CN=*.koper.local, issued by a private "Homelab Root CA" and sent
# with no chain. Read off the registry, not guessed. Nothing in a stock image
# trusts that CA, so it has to be installed into the daemon or the daemon has
# to be told not to care:
#
#   a CA is available     installed at /etc/docker/certs.d/<registry>/ca.crt and
#                         in the system store, and the certificate is VERIFIED.
#                         Two sources, either will do:
#                           REGISTRY_CA_PEM   a CI/CD variable holding the PEM.
#                                             Needs no runner change - set this.
#                           /ca/registry-ca.crt  mounted by the runner, as the
#                                             client-portal job documents.
#
#   no CA                 --insecure-registry, scoped to that one registry, and
#                         the daemon says so in the log. This is what the
#                         client-portal pipeline does today, so this project is
#                         no worse than the one beside it.
#
# THE FALLBACK IS DELIBERATE AND IS THE OPERATOR'S CALL, not an oversight, and
# not something to quietly tighten later. It was raised twice - an unverified
# push means whoever can intercept traffic to that address can substitute the
# image production pulls - and chosen twice, with a working pipeline making the
# same trade as the precedent. What is NOT acceptable is it being silent, so
# the daemon and the job both announce which mode they are in.
#
# To close it: put the CA in REGISTRY_CA_PEM. On a runner host that is
# `cat /usr/local/share/ca-certificates/ca.crt`.
service-image:
  stage: publish
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c

  services:
    # Our own daemon, under an alias the runner is not already using. See
    # subtlety 1 above - this is the whole reason for the alias and the
    # DOCKER_HOST below.
    - name: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: dind-registry
      entrypoint:
        - sh
        - -c
        - |
          set -e

          REGISTRY="${CI_REGISTRY:-registry.koper.local:5050}"
          CA=""

          # A CI/CD variable first: it needs no runner configuration change,
          # which makes it the one an operator can actually act on today.
          if [ -n "${REGISTRY_CA_PEM:-}" ]; then
            printf '%s\n' "$REGISTRY_CA_PEM" > /tmp/registry-ca.crt
            CA=/tmp/registry-ca.crt
            echo "dind: using the CA from REGISTRY_CA_PEM"
          elif [ -f /ca/registry-ca.crt ]; then
            CA=/ca/registry-ca.crt
            echo "dind: using the CA mounted at /ca/registry-ca.crt"
          fi

          if [ -n "$CA" ]; then
            # Both places, because they answer different questions: certs.d is
            # what the daemon consults for THIS registry, the system store is
            # what anything else in the container would use.
            mkdir -p "/etc/docker/certs.d/$REGISTRY"
            cp "$CA" "/etc/docker/certs.d/$REGISTRY/ca.crt"
            cp "$CA" /usr/local/share/ca-certificates/koper-local-ca.crt
            update-ca-certificates 2>/dev/null || true

            echo "dind: $REGISTRY will be VERIFIED against that CA"

            exec dockerd-entrypoint.sh
          fi

          echo "dind: WARNING - no CA available, so $REGISTRY is trusted WITHOUT" >&2
          echo "dind: verification. Whoever can intercept traffic to it can replace the" >&2
          echo "dind: image production pulls. Set REGISTRY_CA_PEM to end this." >&2

          exec dockerd-entrypoint.sh --insecure-registry="$REGISTRY"

  variables:
    # Address OUR daemon, not the runner-provided one aliased `docker`.
    DOCKER_HOST: tcp://dind-registry:2375
    # See subtlety 2. This is the client-to-daemon hop on the job network, not
    # the registry connection.
    DOCKER_TLS_CERTDIR: ""

  # The whole point: a service whose tests do not pass is not publishable, and
  # neither is one built on a package with a known advisory against it.
  needs:
    - job: service-test
    - job: dependencies-audit

  rules:
    # A release tag, and pushes to the default branch. Nothing else - a feature
    # branch that pushed an image would be pushing something nobody reviewed.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  before_script:
    # Wait for our daemon, and say which one answered. Without this the first
    # docker command races the service's startup and fails with "Cannot connect
    # to the Docker daemon", which reads as a missing daemon rather than a slow
    # one.
    - |
      echo "daemon: $DOCKER_HOST"
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done

      if ! docker info >/dev/null 2>&1; then
        echo "service-image: no Docker daemon answered at $DOCKER_HOST after 30s." >&2
        echo "  If the runner refuses privileged services this cannot work; if the alias" >&2
        echo "  collides with one in the runner's config.toml, GitLab logs that above." >&2
        exit 1
      fi
    # Which mode the daemon came up in, on the job's own log rather than only
    # the service's. An empty list here means the CA path was taken.
    - |
      docker info 2>/dev/null | grep -A3 -i "insecure registries" \
        || echo "(no insecure registries: the CA is installed and $CI_REGISTRY is verified)"
    # Credentials. By default the pipeline authenticates as gitlab-ci-token,
    # which can push to this project's own registry and expires with the job -
    # no long-lived credential is stored anywhere for the push side.
    #
    # If the registry ever refuses that identity - a container-repository
    # protection rule restricting who may push a tag is the usual reason -
    # create a Deploy Token with read_registry and write_registry and expose it
    # as two MASKED variables, exactly as the client-portal pipeline documents.
    - |
      if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
        echo "authenticating as deploy token user: $REGISTRY_USER"
        printf '%s' "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      else
        echo "authenticating as CI job token: $CI_REGISTRY_USER"
        printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi

  script:
    # Which tags get pushed is ci/image-tags.sh's decision alone, and it exits
    # non-zero rather than guessing. v1.4.0 -> 1.4.0 and latest; a prerelease
    # tag -> itself and NOT latest; main -> main-<short sha> and main.
    - |
      IMAGE="$CI_REGISTRY_IMAGE/$SERVICE_IMAGE_NAME"
      TAGS="$(ci/image-tags.sh)"
      PRIMARY_TAG="$(printf '%s\n' "$TAGS" | head -n 1)"
    # Quoted as one block: an unquoted `echo "word: word"` entry is a YAML
    # mapping, not a string, and GitLab rejects the whole file. Twice now; see
    # publish and pages, and run `sh ci/lint-ci.sh` before pushing this file.
    - |
      echo "service-image: image base $IMAGE"
      for tag in $TAGS; do
        echo "service-image: will push $IMAGE:$tag"
      done
    # The context is service/, not the repository root: the Dockerfile's COPY
    # paths are relative to it, and service/.dockerignore - which is what keeps
    # a ledger or an outbox out of an image layer - only applies at the root of
    # the context. It is a security control here, not tidiness.
    #
    # Built ONCE and tagged, rather than built per tag: two builds of the same
    # commit are two different image ids, and `main` and `main-<sha>` pointing
    # at different bytes is a rollback that does not roll back.
    - |
      docker build \
        --file service/Dockerfile \
        --label "org.opencontainers.image.title=Emby SSO licence service" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.version=$PRIMARY_TAG" \
        --tag "$IMAGE:$PRIMARY_TAG" \
        service
    # The immutable tag first. If that succeeds and a moving tag then fails, it
    # is a protection rule on the moving tag and not a credentials problem -
    # which is a five-minute diagnosis instead of an afternoon.
    - docker push "$IMAGE:$PRIMARY_TAG"
    - |
      for tag in $TAGS; do
        if [ "$tag" = "$PRIMARY_TAG" ]; then
          continue
        fi

        docker tag "$IMAGE:$PRIMARY_TAG" "$IMAGE:$tag"
        docker push "$IMAGE:$tag"
      done
    - |
      echo "service-image: pushed. The host pulls it with:"
      echo "  docker pull $IMAGE:$PRIMARY_TAG"

# The documentation site (docs/site/, MkDocs with the Material theme),
# published by GitLab Pages from public/ as GitLab's contract requires.
#
# Deliberately independent of the release chain in both directions. `needs: []`
# means it never waits for the test suite, and `allow_failure: true` means a
# broken docs build cannot turn a tag's pipeline red or stop a release from
# being cut. The converse also holds: publish and release hang off build
# through `needs:`, so they run regardless of what this job does.
#
# `allow_failure: true` costs something — a docs build that breaks shows as a
# warning rather than a failure, and it is possible to stop noticing. The
# trade was made deliberately: documentation must never be able to hold up a
# security fix. If that stops being the right call, flip it to false; nothing
# else here depends on it.
pages:
  stage: docs
  # Pinned by digest, not just by tag. An operator reads this site while their
  # server is broken; a toolchain that silently changes what it renders is not
  # acceptable. The Python version and the whole dependency tree in
  # docs/requirements.txt are pinned for the same reason - including mkdocs
  # itself, which matters because MkDocs 2.0 is announced as a
  # backwards-incompatible break that would take the Material theme with it.
  image: python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
  # Starts immediately. Nothing it produces depends on a build artifact, and
  # nothing that produces an artifact depends on it.
  needs: []
  allow_failure: true
  rules:
    # GitLab Pages only ever publishes from the default branch, so building the
    # site on a feature branch produces something nobody can look at. `changes`
    # keeps it off pipelines that touched no documentation; on those, the site
    # already published simply stays up.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - mkdocs.yml
        - docs/requirements.txt
        - docs/site/**/*
        - .gitlab-ci.yml
    # And on demand from the Pipelines page, to republish without a commit.
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    PIP_ROOT_USER_ACTION: "ignore"
  script:
    - python -m pip install --no-input -r docs/requirements.txt
    # docs/superpowers/ is this project's internal development record - specs,
    # plans, spikes, verification notes - and none of it is documentation for
    # an operator. The site's sources live in docs/site/ precisely so that
    # MkDocs cannot reach it: MkDocs only ever reads what is inside docs_dir.
    # This is the tripwire for someone "tidying" that line later.
    - |
      if ! grep -qx 'docs_dir: docs/site' mkdocs.yml; then
        echo "pages: docs_dir is no longer docs/site. Refusing to build: pointing it at docs/ would publish docs/superpowers/, which is internal." >&2
        exit 1
      fi
    # Warnings are errors: a dead cross-reference in a site the plugin's own
    # settings page links into is a real failure, not a nit.
    - mkdocs build --strict
    # Belt and braces, on the built output this time. If anything from the
    # internal record ever reaches public/, do not publish it.
    - |
      if find public -path '*superpowers*' -print -quit | grep -q .; then
        echo "pages: internal development records reached public/. Refusing to publish." >&2
        find public -path '*superpowers*' >&2
        exit 1
      fi
    # Block scalar, not a bare list entry: `- echo "pages: built ..."` parses as
    # a YAML mapping because of the colon-space, and GitLab rejects the whole
    # file - every job, not just this one. Second time in this file; see publish.
    - |
      echo "pages: built $(find public -name '*.html' | wc -l) pages into public/"
  artifacts:
    paths:
      - public
    expire_in: 30 days

# The same documentation, in this project's GitLab wiki.
#
# WHY BOTH. Pages builds a searchable site; the wiki is where people who already
# have access to a PRIVATE project go looking, is editable in the browser when
# something is wrong at three in the morning, and needs no build to read. Both
# are generated from docs/site/, so there is one source and they cannot disagree
# - which is the only arrangement in which having two is not a liability.
#
# ONE DIRECTION. The wiki is overwritten from the repository every time. Anything
# typed into it by hand is lost on the next push to the default branch, and every
# page it writes says so at the top.
#
# It needs WIKI_TOKEN - a project access token with write_repository, masked and
# protected. CI_JOB_TOKEN cannot push to a wiki; GitLab does not grant it that.
# Without the variable this job fails with instructions rather than silently
# doing nothing, and allow_failure keeps that from turning a release red.
wiki:
  stage: docs
  image: alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
  needs: []
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/site/**/*
        - ci/publish-wiki.sh
        - ci/wiki-markdown.awk
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - sh ci/publish-wiki.sh docs/site
